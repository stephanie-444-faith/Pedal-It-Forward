<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" role="img" aria-labelledby="t">
  <title id="t">A smiling panda wearing a green helmet, riding an orange bicycle</title>
  <defs>
    <g id="wheel">
      <circle r="60" fill="#fff" fill-opacity=".35"/>
      <circle r="60" fill="none" stroke="#1d2621" stroke-width="12"/>
      <circle r="52" fill="none" stroke="#b9c3c9" stroke-width="3"/>
      <g stroke="#8a959c" stroke-width="2.2" class="spokes">
        <line x1="0" y1="-52" x2="0" y2="52"/>
        <line x1="-52" y1="0" x2="52" y2="0"/>
        <line x1="-36.8" y1="-36.8" x2="36.8" y2="36.8"/>
        <line x1="-36.8" y1="36.8" x2="36.8" y2="-36.8"/>
        <line x1="-19.9" y1="-48" x2="19.9" y2="48"/>
        <line x1="-48" y1="-19.9" x2="48" y2="19.9"/>
        <line x1="-19.9" y1="48" x2="19.9" y2="-48"/>
        <line x1="-48" y1="19.9" x2="48" y2="-19.9"/>
      </g>
      <circle r="8" fill="#1d2621"/>
    </g>
  </defs>

  <!-- speed lines -->
  <g stroke="#2f7d4e" stroke-width="6" stroke-linecap="round" opacity=".45">
    <line x1="14" y1="160" x2="56" y2="160"/>
    <line x1="4" y1="192" x2="42" y2="192"/>
    <line x1="20" y1="224" x2="50" y2="224"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="228" cy="302" rx="190" ry="9" fill="#1d2621" opacity=".12"/>

  <!-- wheels -->
  <g transform="translate(118 236)"><use href="#wheel"/></g>
  <g transform="translate(338 236)"><use href="#wheel"/></g>

  <!-- frame -->
  <g fill="none" stroke="#f28c28" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 236 L222 240"/>
    <path d="M118 236 L196 142"/>
    <path d="M222 240 L196 142"/>
    <path d="M222 240 L302 150"/>
    <path d="M196 142 L304 144"/>
    <path d="M304 144 L338 236"/>
  </g>

  <!-- chain -->
  <path d="M118 236 L222 240" stroke="#1d2621" stroke-width="2.5" stroke-dasharray="4 3" opacity=".6"/>

  <!-- seat post + saddle -->
  <path d="M196 142 L190 118" stroke="#1d2621" stroke-width="8" stroke-linecap="round"/>
  <path d="M166 116 Q190 104 214 116 Q190 125 166 116 Z" fill="#1d2621"/>

  <!-- stem + bars -->
  <path d="M305 140 L310 116" stroke="#1d2621" stroke-width="8" stroke-linecap="round"/>
  <path d="M294 118 L330 110" stroke="#1d2621" stroke-width="9" stroke-linecap="round"/>

  <!-- back leg (far side) -->
  <path d="M192 150 Q176 196 204 216" fill="none" stroke="#1d2621" stroke-width="20" stroke-linecap="round"/>

  <!-- crank + chainring -->
  <circle cx="222" cy="240" r="22" fill="#fff" stroke="#1d2621" stroke-width="6"/>
  <circle cx="222" cy="240" r="6" fill="#1d2621"/>
  <path d="M222 240 L204 214" stroke="#1d2621" stroke-width="7" stroke-linecap="round"/>
  <path d="M222 240 L240 266" stroke="#1d2621" stroke-width="7" stroke-linecap="round"/>

  <!-- body -->
  <ellipse cx="206" cy="124" rx="44" ry="48" fill="#fff" stroke="#1d2621" stroke-width="5"/>
  <!-- black shoulder band, like a real panda -->
  <path d="M170 98 Q206 78 244 100 L240 118 Q206 100 172 118 Z" fill="#1d2621"/>
  <!-- tummy -->
  <ellipse cx="214" cy="136" rx="22" ry="24" fill="#f3f3ef"/>

  <!-- front leg (near side) to pedal -->
  <path d="M214 160 Q238 210 240 262" fill="none" stroke="#1d2621" stroke-width="22" stroke-linecap="round"/>
  <ellipse cx="244" cy="268" rx="16" ry="9" fill="#1d2621"/>

  <!-- arm to handlebars -->
  <path d="M232 106 Q270 100 306 116" fill="none" stroke="#1d2621" stroke-width="18" stroke-linecap="round"/>
  <circle cx="310" cy="114" r="11" fill="#1d2621"/>

  <!-- head -->
  <g>
    <circle cx="262" cy="66" r="44" fill="#fff" stroke="#1d2621" stroke-width="5"/>
    <circle cx="228" cy="38" r="14" fill="#1d2621"/>
    <circle cx="296" cy="38" r="14" fill="#1d2621"/>
    <!-- helmet -->
    <path d="M218 54 Q262 -2 306 54 Q262 42 218 54 Z" fill="#2f7d4e" stroke="#1d2621" stroke-width="5" stroke-linejoin="round"/>
    <path d="M240 36 Q262 20 284 36" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
    <path d="M222 56 Q218 72 226 82" fill="none" stroke="#1d2621" stroke-width="3" stroke-linecap="round"/>
    <!-- eye patches -->
    <ellipse cx="246" cy="70" rx="11" ry="14" fill="#1d2621" transform="rotate(-15 246 70)"/>
    <ellipse cx="280" cy="70" rx="11" ry="14" fill="#1d2621" transform="rotate(15 280 70)"/>
    <circle cx="248" cy="68" r="5" fill="#fff"/>
    <circle cx="249.5" cy="68" r="2.6" fill="#1d2621"/>
    <circle cx="282" cy="68" r="5" fill="#fff"/>
    <circle cx="283.5" cy="68" r="2.6" fill="#1d2621"/>
    <!-- nose + smile -->
    <ellipse cx="266" cy="88" rx="7" ry="5" fill="#1d2621"/>
    <path d="M252 96 Q266 108 280 96" fill="none" stroke="#1d2621" stroke-width="4" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="236" cy="90" r="6" fill="#f7a78e" opacity=".85"/>
    <circle cx="296" cy="90" r="6" fill="#f7a78e" opacity=".85"/>
  </g>
</svg>
